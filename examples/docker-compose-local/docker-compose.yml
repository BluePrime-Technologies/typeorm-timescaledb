services:
  timescaledb:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:2.18.0-pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timescale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timescale}
      POSTGRES_DB: ${POSTGRES_DB:-typeorm_timescaledb_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init-timescaledb.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-timescale} -d $${POSTGRES_DB:-typeorm_timescaledb_local}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  timescaledb-data:
