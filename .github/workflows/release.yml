name: release

# Releases are cut by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing (tokenless)

# Never run two publish jobs for the same tag concurrently; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: this workflow holds publish credentials (NPM_TOKEN + OIDC), so the
      # actions are pinned to commit SHAs rather than moving tags for supply-chain safety.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # need history to verify the tag is on main
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Only publish tags that point at a commit on main (releases come from reviewed main).
      - name: Verify tag is on main
        run: |
          git fetch --no-tags --depth=2147483647 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main — releases must come from main"; exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit

      # The tag must match the published versions (v0.1.0 -> 0.1.0).
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in core typeorm; do
            V=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME != packages/$pkg version $V"; exit 1
            fi
          done
          echo "tag $GITHUB_REF_NAME matches version $TAG"

      # Publish core first (typeorm-timescaledb depends on it). pnpm publish rewrites the
      # workspace:* core dependency to the real version and emits npm provenance. Each step
      # is idempotent — it skips a version already on npm so a half-failed release can be
      # re-run on the same tag. Auth: NPM_TOKEN secret, or OIDC trusted publishing if unset.
      - name: Publish @blueprime/timescaledb-core
        run: |
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "@blueprime/timescaledb-core@$V" version >/dev/null 2>&1; then
            echo "core@$V already published — skipping"
          else
            pnpm --filter @blueprime/timescaledb-core publish --no-git-checks --access public --provenance
          fi
          # A scoped package's FIRST publish under a new org can report success yet still
          # 404 for anonymous installs until access is (re)asserted — see RELEASING.md.
          # This re-assert is idempotent and kicks the public read-path. Skipped under
          # tokenless OIDC (no token to authenticate the access call).
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm access set status=public @blueprime/timescaledb-core
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish typeorm-timescaledb
        run: |
          V=$(node -p "require('./packages/typeorm/package.json').version")
          if npm view "typeorm-timescaledb@$V" version >/dev/null 2>&1; then
            echo "typeorm-timescaledb@$V already published — skipping"
          else
            pnpm --filter typeorm-timescaledb publish --no-git-checks --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
