name: release

# Releases are cut by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing (tokenless)

# Never run two publish jobs for the same tag concurrently; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: this workflow holds publish credentials (NPM_TOKEN + OIDC), so the
      # actions are pinned to commit SHAs rather than moving tags for supply-chain safety.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit

      # The tag must match the published versions (v0.1.0 -> 0.1.0).
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in core typeorm; do
            V=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME != packages/$pkg version $V"; exit 1
            fi
          done
          echo "tag $GITHUB_REF_NAME matches version $TAG"

      # pnpm publish rewrites the workspace:* core dependency to the real version and
      # emits npm provenance. core is published first (typeorm-timescaledb depends on it).
      # If you use a token instead of OIDC trusted publishing, set the NPM_TOKEN secret;
      # otherwise configure a trusted publisher for both packages on npmjs.com.
      - name: Publish @blueprime-technologies/timescaledb-core
        run: pnpm --filter @blueprime-technologies/timescaledb-core publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish typeorm-timescaledb
        run: pnpm --filter typeorm-timescaledb publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
