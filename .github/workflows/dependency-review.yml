name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: review
        name: Review dependency changes
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
      - name: Explain advisory mode
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning::Dependency Review did not complete. Confirm the repository has GitHub dependency graph / dependency review support enabled, then remove continue-on-error and make this check required."
