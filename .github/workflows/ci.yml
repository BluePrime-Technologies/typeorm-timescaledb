name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    name: lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration:
    name: integration (node ${{ matrix.node }}, typeorm ${{ matrix.typeorm }}, tsdb ${{ matrix.timescaledb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        typeorm: ['0.3.20', '1.0.0']
        # 2.18 is the floor: the columnstore DDL we emit (enable_columnstore /
        # add_columnstore_policy) landed in 2.18.0; 2.17 only has legacy compression.
        timescaledb: ['2.18.0-pg16', 'latest-pg17']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Override the version on the package that imports typeorm (not the root), so the
      # matrix actually exercises 0.3.20 — a root -w add leaves the package's own devDep.
      - run: pnpm --filter typeorm-timescaledb add -D typeorm@${{ matrix.typeorm }}
      # Fail loud if the wrong version resolved (guards the matrix from silently no-op'ing).
      - name: Verify resolved TypeORM version
        run: |
          # read the file by path (typeorm's exports map doesn't expose ./package.json)
          RESOLVED=$(node -p "require('./packages/typeorm/node_modules/typeorm/package.json').version")
          echo "Resolved typeorm: $RESOLVED (expected ${{ matrix.typeorm }})"
          case "$RESOLVED" in ${{ matrix.typeorm }}*) ;; *) echo "::error::typeorm $RESOLVED != ${{ matrix.typeorm }}"; exit 1 ;; esac
      - run: pnpm build
      # Pre-pull the image with retries so a transient Docker Hub 500 doesn't fail the
      # suite (Testcontainers reuses the cached image instead of pulling mid-test).
      - name: Pre-pull TimescaleDB image
        run: |
          for i in 1 2 3 4 5; do
            docker pull "timescale/timescaledb:${{ matrix.timescaledb }}" && exit 0
            echo "pull attempt $i failed; retrying in $((i*10))s..."; sleep $((i*10))
          done
          echo "::error::could not pull timescale/timescaledb:${{ matrix.timescaledb }} after retries"; exit 1
      - run: pnpm test
        env:
          # Testcontainers boots TimescaleDB itself; image selected per matrix cell.
          TIMESCALE_IMAGE: timescale/timescaledb:${{ matrix.timescaledb }}

  integration-toolkit:
    name: integration (timescaledb_toolkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # timescaledb-ha bundles timescaledb_toolkit (candlesticks / approx_count_distinct).
      - name: Pre-pull TimescaleDB-HA (toolkit) image
        run: |
          for i in 1 2 3 4 5; do
            docker pull "timescale/timescaledb-ha:pg17" && exit 0
            echo "pull attempt $i failed; retrying in $((i*10))s..."; sleep $((i*10))
          done
          echo "::error::could not pull timescale/timescaledb-ha:pg17 after retries"; exit 1
      - run: pnpm test
        env:
          # Only the toolkit image is set, so the toolkit suite runs and the
          # no-toolkit guard block self-skips (it needs TIMESCALE_IMAGE).
          TIMESCALE_TOOLKIT_IMAGE: timescale/timescaledb-ha:pg17
