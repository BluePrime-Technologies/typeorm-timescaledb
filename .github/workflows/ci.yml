name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the floating-`latest` early-warning job only. Every other job is fully pinned, so a
  # server-side change surfaces here rather than on an unrelated pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint-unit:
    name: lint + typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Fails when a public "what ships" page still advertises an older release line. Four such
      # surfaces were found stale in one week, each by accident; docs/feature-status.md drifted
      # three releases while containing its own "Review rule" section telling maintainers not to.
      - run: pnpm check:version-claims
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  package-smoke:
    name: package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package-smoke

  integration:
    name: integration (node ${{ matrix.node }}, typeorm ${{ matrix.typeorm }}, tsdb ${{ matrix.timescaledb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        typeorm: ['0.3.20', '1.0.0']
        # BOTH ends pinned, deliberately.
        #
        # 2.18 is the floor: the columnstore DDL we emit (enable_columnstore /
        # add_columnstore_policy) landed in 2.18.0; 2.17 only has legacy compression.
        #
        # The ceiling used to be the floating `latest-pg17`, and that cost real time: the 2.29
        # removal of schema_name/table_name/compressed_chunk_id from _timescaledb_catalog.chunk
        # landed on whoever pushed next, so a contributor who changed nothing related had to debug
        # it. A floating ceiling also means an old green run cannot be re-run to the same server,
        # and — for a published library whose compatibility claim is a public promise — the version
        # we certify against should be a decision, not a Docker Hub side effect.
        #
        # `latest` still gets tested, in the scheduled early-warning job at the bottom of this file,
        # where an upstream change breaks a nightly instead of an unrelated PR.
        timescaledb: ['2.18.0-pg16', '2.29.1-pg17']
        include:
          # Version-axis legs. One node/typeorm cell each — the full cross is already covered above —
          # pinned to the releases where the catalog actually MOVED, plus the second PG major.
          # Every tag here was confirmed to resolve on Docker Hub before being added.
          - node: 22
            typeorm: '1.0.0'
            # compression_settings.relid re-keys from the compressed twin to the user-facing chunk:
            # the boundary that flips the recompression planner between its LEGACY and MODERN queries.
            timescaledb: '2.19.0-pg16'
          - node: 22
            typeorm: '1.0.0'
            # _timescaledb_catalog.chunk.dropped removed.
            timescaledb: '2.26.0-pg17'
          - node: 22
            typeorm: '1.0.0'
            # PostgreSQL 18. Previously unreachable, because `latest-pg17` pinned the PG axis to 17
            # by accident while the README claimed no PG ceiling at all.
            timescaledb: '2.29.1-pg18'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Override the version on every package that imports typeorm (not the root), so the matrix
      # actually exercises 0.3.20 — a root -w add leaves each package's own devDep. @blueprime/
      # cross-store's ./typeorm subpath (DataSourceAdapter) needs this too, or its peer claim
      # "^0.3.20 || ^1.0.0" would go untested on the 0.3.20 leg (it would resolve its own ^1.0.0).
      - run: pnpm --filter typeorm-timescaledb --filter @blueprime/cross-store add -D typeorm@${{ matrix.typeorm }}
      # Fail loud if the wrong version resolved (guards the matrix from silently no-op'ing).
      - name: Verify resolved TypeORM version
        run: |
          # read the file by path (typeorm's exports map doesn't expose ./package.json)
          for pkg in packages/typeorm packages/cross-store; do
            RESOLVED=$(node -p "require('./$pkg/node_modules/typeorm/package.json').version")
            echo "Resolved typeorm in $pkg: $RESOLVED (expected ${{ matrix.typeorm }})"
            case "$RESOLVED" in
              ${{ matrix.typeorm }}*) ;;
              *) echo "::error::$pkg: typeorm $RESOLVED != ${{ matrix.typeorm }}"; exit 1 ;;
            esac
          done
      - run: pnpm build
      # @blueprime/cross-store's Prisma integration test dynamic-imports @prisma/client, so the
      # generated client must exist. pnpm skips the package's build scripts, so generate explicitly.
      - name: Generate Prisma client (cross-store)
        run: pnpm --filter @blueprime/cross-store exec prisma generate
        env:
          CROSS_STORE_DATABASE_URL: postgresql://x:x@localhost:5432/x
      # Pre-pull the image with retries so a transient Docker Hub 500 doesn't fail the
      # suite (Testcontainers reuses the cached image instead of pulling mid-test).
      - name: Pre-pull TimescaleDB image
        run: |
          for i in 1 2 3 4 5; do
            docker pull "timescale/timescaledb:${{ matrix.timescaledb }}" && exit 0
            echo "pull attempt $i failed; retrying in $((i*10))s..."; sleep $((i*10))
          done
          echo "::error::could not pull timescale/timescaledb:${{ matrix.timescaledb }} after retries"; exit 1
      - run: pnpm test
        env:
          # Testcontainers boots TimescaleDB itself; image selected per matrix cell.
          TIMESCALE_IMAGE: timescale/timescaledb:${{ matrix.timescaledb }}

  integration-toolkit:
    name: integration (timescaledb_toolkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # timescaledb-ha bundles timescaledb_toolkit (candlesticks / approx_count_distinct).
      - name: Pre-pull TimescaleDB-HA (toolkit) image
        run: |
          for i in 1 2 3 4 5; do
            docker pull "timescale/timescaledb-ha:pg17.10-ts2.29.1" && exit 0
            echo "pull attempt $i failed; retrying in $((i*10))s..."; sleep $((i*10))
          done
          echo "::error::could not pull timescale/timescaledb-ha:pg17.10-ts2.29.1 after retries"; exit 1
      - run: pnpm test
        env:
          # Only the toolkit image is set, so the toolkit suite runs and the
          # no-toolkit guard block self-skips (it needs TIMESCALE_IMAGE).
          TIMESCALE_TOOLKIT_IMAGE: timescale/timescaledb-ha:pg17.10-ts2.29.1

  # Floating `latest`, on purpose and in one place. This is how we learn early that upstream moved
  # the catalog again — the 2.29 chunk-column removal is the precedent — without letting that
  # discovery arrive as a red build on someone else's unrelated PR.
  #
  # `continue-on-error` because a break here is NEWS, not a merge blocker: nothing has shipped
  # against `latest` and no compatibility claim covers it. When it fires, the fix is to add a pinned
  # matrix leg for the new version.
  integration-latest:
    name: integration (floating latest — early warning)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        timescaledb: ['latest-pg17', 'latest-pg18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter typeorm-timescaledb test
        env:
          TIMESCALE_IMAGE: timescale/timescaledb:${{ matrix.timescaledb }}
