name: release-cross-store

# @blueprime/cross-store is versioned INDEPENDENTLY of typeorm-timescaledb /
# @blueprime/timescaledb-core. Cut a cross-store release by pushing a tag like
# `cross-store-v0.1.0` (distinct from the `v*` tags the main release workflow uses).
on:
  push:
    tags: ['cross-store-v*']

permissions:
  contents: read
  id-token: write # npm provenance + OIDC

concurrency:
  group: release-cross-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish @blueprime/cross-store to npm
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned like the main release workflow — this job holds publish credentials.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify tag is on main
        run: |
          git fetch --no-tags --depth=2147483647 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main — releases must come from main"; exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit

      # The tag must match the cross-store package version (cross-store-v0.1.0 -> 0.1.0).
      - name: Verify tag matches @blueprime/cross-store version
        run: |
          TAG="${GITHUB_REF_NAME#cross-store-v}"
          V=$(node -p "require('./packages/cross-store/package.json').version")
          if [ "$V" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME != packages/cross-store version $V"; exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $TAG"

      # Publish @blueprime/cross-store. Its `@blueprime/timescaledb-core` workspace:* dependency is
      # rewritten by pnpm to the concrete published core version. Idempotent: skips a version already
      # on npm so a half-failed release can be re-run on the same tag. Auth: NPM_TOKEN, or OIDC if unset.
      - name: Publish @blueprime/cross-store
        run: |
          V=$(node -p "require('./packages/cross-store/package.json').version")
          if npm view "@blueprime/cross-store@$V" version >/dev/null 2>&1; then
            echo "cross-store@$V already published — skipping"
          else
            pnpm --filter @blueprime/cross-store publish --no-git-checks --access public --provenance
          fi
          # A scoped package's FIRST publish under an org can 404 for anonymous installs until access
          # is (re)asserted — idempotent re-assert; skipped under tokenless OIDC (no token).
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm access set status=public @blueprime/cross-store
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
